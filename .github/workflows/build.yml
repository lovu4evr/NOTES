name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project (root / subfolder / zip)
        id: find
        shell: bash
        run: |
          set -e
          DIR=""

          # 1) Project already extracted in repo (root ya subfolder)
          S=$(find . -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' -not -path '*/__MACOSX/*' | head -1)
          if [ -n "$S" ]; then
            DIR="$(cd "$(dirname "$S")" && pwd)"
          else
            # 2) Zip files me dhoondo
            echo "No extracted project, searching zips..."
            mapfile -t ZIPS < <(find . -maxdepth 5 -iname '*.zip' -not -path './.git/*')
            if [ ${#ZIPS[@]} -eq 0 ]; then
              echo "No project or zip found in repo"; exit 1
            fi
            i=0
            for Z in "${ZIPS[@]}"; do
              i=$((i+1))
              OUT="$RUNNER_TEMP/proj$i"
              mkdir -p "$OUT"
              echo "Unzipping: $Z"
              unzip -q -o "$Z" -d "$OUT" || continue
              S=$(find "$OUT" \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -1)
              if [ -n "$S" ]; then
                DIR="$(cd "$(dirname "$S")" && pwd)"
                break
              fi
            done
            if [ -z "$DIR" ]; then
              echo "settings.gradle not found in any zip"; exit 1
            fi
          fi

          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          if [ -f "$DIR/gradlew" ]; then
            chmod +x "$DIR/gradlew"
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "${{ steps.find.outputs.dir }}/local.properties"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Unit tests
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: ${{ steps.find.outputs.cmd }} test --no-daemon || true

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -o pipefail
          ${{ steps.find.outputs.cmd }} assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors on failure
        if: failure()
        shell: bash
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "=== ERRORS ==="
          grep -E "^e: " build.log | head -40 || true
          echo "=== WHAT WENT WRONG ==="
          grep -A6 "What went wrong" build.log | head -30 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherNotes-APK
          path: ${{ steps.find.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.find.outputs.dir }}/**/build/reports
          if-no-files-found: ignore
